# 把 PWA 发布到 GitHub Pages（HTTPS、地址固定、不依赖电脑开机）。
# 只发布静态页面和菜谱目录。库存等个人数据都在手机的 IndexedDB 里，不会上传。
# 启用：仓库 Settings → Pages → Source 选 GitHub Actions。
name: Deploy PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
